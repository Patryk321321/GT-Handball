<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Rammetto+One&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a class="logo" href="/">
            <img src="logo.PNG" alt="przejdź do strony głównej" class="logo__img" width="800px" height="800px">
        </a>
        <a href="#kontaktid" class="button header__button">
            Skontaktuj się z nami
        </a>

        <a href="#aktualnosciid" class="button aktualnosci__button">
            Dowiedz się o przyszłości i teraźniejszości
        </a>

        <a href="#przeszloscid" class="button przeszlosc__button">
            Informacje o przeszłości
        </a>
    </header>
    <main class="wazne-tresc">
        <section class="sekcja sekcja--galeria"></section>
    </main>
    <footer class="sekcja footer">
        <p>
            Made of Polska
        </p>
    </footer>
</body>
</html>
